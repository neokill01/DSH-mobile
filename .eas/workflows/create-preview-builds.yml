name: Create Preview Builds

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android Preview
    type: build
    params:
      platform: android
      profile: preview-android

  build_ios:
    name: Build iOS Preview
    type: build
    params:
      platform: ios
      profile: preview-ios
